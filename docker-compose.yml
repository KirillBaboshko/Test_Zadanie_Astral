version: '3.8'

services:
  # PostgreSQL база данных
  postgres:
    image: postgres:16-alpine
    container_name: chatapp-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chatapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database-setup.sql:/docker-entrypoint-initdb.d/01-setup.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chatapp-network

  # RabbitMQ message broker
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: chatapp-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP протокол
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - chatapp-network

  # Server API
  server:
    build:
      context: .
      dockerfile: src/Server/ChatApp.Server.Api/Dockerfile
    container_name: chatapp-server
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=chatapp;Username=postgres;Password=postgres
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
      - Jwt__Issuer=ChatApp
      - Jwt__Audience=ChatApp.Client
    ports:
      - "5096:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - chatapp-network
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: src/Client/ChatApp.Client.Console/Dockerfile
    container_name: chatapp-client
    stdin_open: true
    tty: true
    depends_on:
      - server
    networks:
      - chatapp-network
    restart: "no"
    profiles:
      - client

volumes:
  postgres_data:
    name: chatapp-postgres-data
  rabbitmq_data:
    name: chatapp-rabbitmq-data

networks:
  chatapp-network:
    name: chatapp-network
    driver: bridge
