worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Blazor WebAssembly требует правильные MIME types
        types {
            application/wasm wasm;
            application/octet-stream dll;
            application/octet-stream pdb;
            application/json json;
        }

        # Основной маршрут для Blazor SPA
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Статические файлы
        location ~* \.(js|css|wasm|dll|pdb|json|png|jpg|jpeg|gif|svg|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Blazor framework файлы
        location /_framework/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Proxy для API запросов к серверу
        location /api/ {
            proxy_pass http://server:5096/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}
